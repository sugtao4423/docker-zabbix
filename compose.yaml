services:
  zabbix-agent2:
    image: zabbix/zabbix-agent2:ubuntu-latest
    hostname: zabbix-agent2
    environment:
      - ZBX_HOSTNAME=zabbix-server
      - ZBX_SERVER_HOST=zabbix-server
    restart: always

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-latest
    hostname: zabbix-server
    ports:
      - 10051:10051
    links:
      - zabbix-agent2
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ZBX_ENABLE_SNMP_TRAPS=true
    env_file: ./mysql-vars.env
    restart: always

  zabbix-web-nginx-mysql:
    #image: zabbix/zabbix-web-nginx-mysql:ubuntu-latest
    hostname: zabbix-web-nginx-mysql
    build:
      context: ./dockerfiles
      dockerfile: ZBXFront
    ports:
      - 80:8080
    links:
      - zabbix-server
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Asia/Tokyo
    env_file: ./mysql-vars.env
    restart: always
